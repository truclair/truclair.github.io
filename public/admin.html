<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Truclair Commissions Dashboard</title>
        <link rel="icon" type="image/png" href="illustration/Icon.png">
        <link rel="apple-touch-icon" href="illustration/Icon.png">
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

        <meta property="og:title" content="Truclair Commissions Dashboard">
        <meta property="og:description" content= "Commission Handling • Client Management">
        <meta property="og:image" content="https://commissions.truclair.workers.dev/illustration/AdminPageCard.png">
        <meta property="og:url" content="https://commissions.truclair.workers.dev/admin">
        <meta property="og:type" content="website">
        
        <!-- Helps Discord/Twitter show a large preview -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:image" content="https://commissions.truclair.workers.dev/illustration/AdminPageCard.png">
    </head>
    <body>
        
        <div class="top-gradient"></div>

        <!-- TOPBAR NAVIGATION  -->
        <div class="topnav">
            <a href="#home">Home</a>
            <a href="#dashboard">Dashboard</a>
        </div>

        <div class="content">


            <!-- HERO PAGE  -->
            <section id="home" class="hero">
                <video class="hero-video" autoplay loop muted playsinline>
                    <source src="illustration/2026-01-07-Peer-Pressure (Reduced 2).mp4" type="video/mp4">
                </video>
                <div class="hero-darken"></div>
                <div class="hero-content">
                    <h1>TRUCLAIR</h1>
                    <label class="hero-intro">Welcome! Follow these steps to complete your commissions.</label>
                    <ol class="hero-steps">
                        <li>Scroll down to accept, reject, and view image references.</li>
                        <li>Remember to take breaks and rest between sessions.</li>
                        <li>You got this!</li>
                    </ol>
                </div>
                <h3></h3>
                <div class="commission-container">
                <p id="count"></p>
                </div>
            </section>

            <h1>COMMISSIONS</h1>
            <div id="dashboard" class="commission-container">
                <div id="commissionList" class="commission-list"></div>
            </div>
        </div>
        <script type="module" src="src/admin.js"></script>
        <script type="module" src="src/stats.js"></script>
    </body>
</html>
