name = "truclair-github-io"
compatibility_date = "2026-08-03"
main = "src/worker.js"

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DATABASE"
database_name = "commissions"
database_id = "33a95f16-a250-4a4a-853a-51234f5f1e09"

[[r2_buckets]]
binding = "REFERENCES"
bucket_name = "commissions"

# Set ADMIN_TOKEN as a secret: npx wrangler secret put ADMIN_TOKEN
