name = "truclair-github-io"
compatibility_date = "2026-08-03"
main = "src/worker.js"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "truclair-commissions"
